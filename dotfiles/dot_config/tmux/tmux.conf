# tmux.conf — managed by chezmoi (source: dotfiles/dot_config/tmux/tmux.conf)
# Keybinding rationale documented in wiki/tmux-pane-keybindings.md

# Prefix stays C-b; pass it through with C-b C-b
set -g prefix C-b
bind C-b send-prefix

# Terminal and behavior
set -g default-terminal "tmux-256color"
set -g mouse on
set -g history-limit 50000
set -sg escape-time 10

# Windows and panes count from 1
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Splits: | side-by-side, - stacked, keep cwd
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
# Full-width/height variants
bind '"' split-window -fv -c "#{pane_current_path}"
bind %   split-window -fh -c "#{pane_current_path}"

# Vim navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Repeatable resize, 5 cells
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind z resize-pane -Z

# Equalize panes
bind '\' select-layout even-horizontal \; display "equal columns"
bind _   select-layout even-vertical   \; display "equal rows"
bind e   select-layout tiled           \; display "tiled"
bind E   select-layout -E              \; display "spread neighbours"

# Main-pane layouts
set -g main-pane-width 60%
set -g main-pane-height 60%
bind m select-layout main-vertical   \; swap-pane -s "{top-left}"
bind M select-layout main-horizontal \; swap-pane -s "{top-left}"

# Reload
bind r source-file ~/.config/tmux/tmux.conf \; display "config reloaded"

# Status line
set -g status-position top
set -g status-interval 5
set -g status-left "#[bold] #S "
set -g status-right " %H:%M "
